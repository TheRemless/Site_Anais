<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zwald Travel Planner - Voyage sur mesure en Thaïlande</title>
    <meta name="description" content="Travel Planner spécialisée en Thaïlande et Asie du Sud-Est. Voyages sur mesure, carnets personnalisés et accompagnement complet.">
  </head>
  <body>
    <!-- Hidden Netlify form for bot detection (React SPA) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
