# Configuration minimale pour déployer les fonctions de Gestion avec la CLI Supabase.
project_id = "lkxqcmzeidlyssoqmqkh"

# La fonction est appelée par pg_cron, pas par un utilisateur connecté : elle vérifie elle-même son secret (RAPPELS_SECRET).
[functions.rappels]
verify_jwt = false

# Appelée par l'outil avec la session de la personne connectée : la passerelle vérifie le jeton, la fonction vérifie ensuite les droits.
[functions.assistant]
verify_jwt = true

# Appelée par le site public (secrettravelandtour.com) sans compte : la fonction contrôle elle-même l'origine, la taille, le piège à robots et la cadence.
[functions.demande-site]
verify_jwt = false

# Lecture publique des bandeaux en ligne (aucune donnée privée), mise en cache une minute.
[functions.bandeau-site]
verify_jwt = false
