[build]
  command = "npm run build"
  publish = "_site"
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data/currency-rates.json'"

[functions]
  directory = "netlify/functions"

# Outil de gestion privé : jamais indexé, jamais intégré dans une autre page, toujours revalidé.
[[headers]]
  for = "/gestion/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
