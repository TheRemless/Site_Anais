[build]
  command = "npm run build"
  publish = "_site"
  ignore = "bash scripts/netlify-ignore.sh"

[functions]
  directory = "netlify/functions"

# Outil de gestion privé : jamais indexé, jamais intégré dans une autre page.
# Cache (ouverture rapide, 19.11.2026) : pas de Cache-Control ici, sinon il se combinerait avec celui des fichiers empreintés ci-dessous.
# Sans lui, Netlify revalide à chaque ouverture (public, max-age=0, must-revalidate) ; la page, version.json et le service worker le disent
# en plus explicitement plus bas. Seuls les fichiers regroupés de /gestion/b/, dont le nom porte l'empreinte du contenu, se gardent un an.
[[headers]]
  for = "/gestion/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    # Politique de sécurité du contenu : scripts de l'outil seulement (aucun script ni gestionnaire en ligne dans index.html), polices et images locales ou en data:/blob:
    # (aperçus, PDF, captures html2canvas), réseau vers Supabase seulement, aucune intégration dans une autre page. Les styles en ligne sont permis : l'interface en pose
    # par attribut (largeurs, variables). Toute nouvelle origine (autre API, CDN, police) doit être ajoutée ici, sinon le navigateur la bloque.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lkxqcmzeidlyssoqmqkh.supabase.co; font-src 'self'; connect-src 'self' https://lkxqcmzeidlyssoqmqkh.supabase.co wss://lkxqcmzeidlyssoqmqkh.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Pages de carnet : guides réservés aux clients, ouverts depuis le PDF du carnet. Jamais indexées ni archivées, adresse jamais transmise en référent.
# Aucun Disallow dans robots.txt (il révélerait l'adresse) : noindex ici et dans la page.
[[headers]]
  for = "/carnet/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

# Cache navigateur. Les images générées dans /img/ portent un hash dans leur nom :
# elles ne changent jamais, cache d'un an. Les sources (/images/), polices, CSS et JS
# gardent un nom stable : une semaine, revalidation en arrière-plan.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gestion : fichiers regroupés au build (scripts/regrouper-gestion.cjs). Un nom = un contenu, pour toujours : cache d'un an sans revalidation.
[[headers]]
  for = "/gestion/b/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gestion : ce qui désigne la version en ligne est relu à chaque ouverture.
[[headers]]
  for = "/gestion/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/gestion/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/gestion/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/gestion/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
