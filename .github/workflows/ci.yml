name: CI

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Le sitemap est généré par Eleventy et un test le lit dans _site/.
      - run: npm run build

      - run: npm test

      # Les contrôles SQL rejouent schema.sql et les migrations sur un Postgres en mémoire (PGlite, installé hors du dépôt, aucun secret) :
      # droits par rôle, nets et commissions, statistiques, sauvegarde et corbeille. Un changement du SQL qui rouvre une fuite fait échouer la CI.
      - name: Contrôles de la base (Postgres en mémoire)
        run: |
          # pipefail : sans lui, « node … | tail » rend le code de tail et un contrôle en échec laissait la CI au vert.
          set -o pipefail
          mkdir -p /tmp/verif && cd /tmp/verif
          npm init -y >/dev/null
          npm i @electric-sql/pglite@0.2.17 --silent
          cp "$GITHUB_WORKSPACE"/docs/gestion/verif-*.mjs "$GITHUB_WORKSPACE"/docs/gestion/schema-v1-reference.sql .
          export GESTION_SQL="$GITHUB_WORKSPACE/docs/gestion/" GESTION_SRC="file://$GITHUB_WORKSPACE/src/gestion/js/" GESTION_SAUV="file://$GITHUB_WORKSPACE/docs/gestion/sauvegarde/sauvegarde-lib.mjs"
          for f in verif-securite verif-securite-argent verif-sauvegarde verif-sauvegarde-archive verif-analyses verif-versions verif-fiduciaire verif-journal-nets verif-partenaires-supprimer verif-documents verif-fusion-clients verif-equipe-reglages verif-site verif-rappel-h1 verif-organisations verif-regles-partenaires verif-partage-clients verif-agent verif-agent-credit verif-ameliorations verif-encaisser-commissions verif-whatsapp verif-espace-unifie verif-whatsapp-fiabilite verif-assistant-whatsapp verif-contacts-apporteurs verif-ia-tous-contacts verif-whatsapp-nom verif-demandes-whatsapp verif-whatsapp-voucher verif-agent-apprendre-nani verif-whatsapp-manquants verif-whatsapp-pret; do
            echo "== $f"
            node "$f.mjs" | tail -n 25
          done
          # Ces deux contrôles lisent le code de l'outil par un chemin (GESTION_SRC sans file://, ou ../src depuis leur dossier).
          echo "== verif-mise-en-route"
          GESTION_SRC="$GITHUB_WORKSPACE/src/gestion/js/" node verif-mise-en-route.mjs | tail -n 25
          echo "== verif-noms-marques"
          ln -sfn "$GITHUB_WORKSPACE/src" /tmp/src
          node verif-noms-marques.mjs | tail -n 25
