# Amélioration Gestion (20.11.2026) : une demande validée dans l'Assistant de Gestion devient une PR en brouillon.
#
# La fonction Supabase « ameliorations » ouvre une issue avec le label « amelioration-gestion » (jeton de Jérémy, droits Issues seulement).
# Ce workflow :
#   1. verifier    : l'issue vient bien de la fonction (auteur et label posés par le propriétaire, repère dans le corps), plafond du jour ;
#   2. implementer : Claude fait le changement par l'agent de scripts/amelioration-agent (API Claude, SDK officiel ; Claude Code n'est pas
#                    couvert par le crédit promotionnel), avec un jeton en LECTURE seule : il ne peut ni pousser, ni fusionner, ni ouvrir de PR,
#                    ni exécuter de code (lecture et édition seulement : un code exécuté dans ce job pourrait lire la clé Anthropic). Son seul
#                    secret est cette clé ; aucun secret Supabase ni Netlify n'existe dans ce dépôt ;
#   3. tester      : sans aucun secret, build et tests du patch (résultat indicatif : le code testé peut écrire ce qu'il veut) ;
#   4. ouvrir-pr   : sans Claude et sans exécuter de code du dépôt, une étape fixe contrôle les fichiers touchés (refuse .github/,
#                    netlify.toml, dépendances, liens symboliques…), pousse une branche amelioration/issue-N-… et ouvre une PR en brouillon, marquée « à relire de près » si elle
#                    touche supabase/, une migration, les droits, l'authentification ou les paiements. Elle écrit le lien dans l'issue :
#                    la fonction « rappels » le lit et prévient Jérémy ;
#   5. echec       : l'issue reçoit le repère d'échec (Jérémy est prévenu de la même façon) ;
#   6. fermer      : une PR d'amélioration fermée sans fusion ferme son issue « not planned » (la demande passe à « refusée »).
# Rien ne fusionne, rien ne se déploie, aucune migration ne s'applique : c'est Jérémy, ou une session Claude Code après /code-review.
# Doc : docs/gestion/ameliorations.md.
name: Amélioration Gestion

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

permissions: {}

# Un seul passage à la fois par demande (label retiré puis remis pendant un passage : le second attend). Les demandes différentes tournent
# en parallèle ; leur nombre est borné par la fonction (3 par jour) et par le plafond ci-dessous.
concurrency:
  group: amelioration-gestion-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PLAFOND_JOUR: "5"

jobs:
  verifier:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'amelioration-gestion' &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Repère de la fonction et plafond du jour
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number }}
          CORPS: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          case "$CORPS" in
            "<!-- gestion-amelioration id="*) ;;
            *) echo "Issue sans le repère de la fonction : rien à faire."; exit 1 ;;
          esac
          case ",$LABELS," in
            *,amelioration-pr-prete,*) echo "Déjà traitée."; exit 1 ;;
          esac
          jour=$(date -u +%Y-%m-%d)
          n=$(gh issue list -R "$DEPOT" --label amelioration-gestion --state all --search "created:>=$jour" --json number --jq length)
          if [ "$n" -gt "$PLAFOND_JOUR" ]; then
            gh issue comment "$NUMERO" -R "$DEPOT" --body "Plafond de $PLAFOND_JOUR demandes par jour atteint : relancer demain en retirant puis en remettant le label.<!-- gestion-echec -->"
            exit 1
          fi

  implementer:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Lecture seule : Claude ne peut rien écrire sur GitHub. Le patch sort comme un fichier, repris par l'étape suivante.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Le SDK officiel, à une version fixée, installé hors du dépôt et sans script d'installation : aucune dépendance du dépôt n'est
      # installée ni exécutée dans ce job.
      - name: SDK Anthropic
        run: npm i --prefix "$RUNNER_TEMP/sdk" --ignore-scripts --no-audit --no-fund --no-package-lock @anthropic-ai/sdk@1.3.0

      # L'agent de scripts/amelioration-agent (version de master, celle de cette exécution) appelle l'API Claude directement : le crédit
      # promotionnel de l'organisation couvre l'API, pas Claude Code. Claude ne peut que lire, chercher et modifier des fichiers.
      # Plafonds : 60 appels, 5 dollars (coût estimé), 40 minutes (timeout du job).
      - name: Claude fait l'amélioration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SDK_DIR: ${{ runner.temp }}/sdk
          DEMANDE_TITRE: ${{ github.event.issue.title }}
          DEMANDE_CORPS: ${{ github.event.issue.body }}
          NUMERO: ${{ github.event.issue.number }}
          PLAFOND_USD: "5"
          TOURS_MAX: "60"
        run: node scripts/amelioration-agent/agent.mjs

      # Aucun code du dépôt n'a tourné dans ce job : le patch est celui que Claude a écrit.
      - name: Patch du changement
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sortie"
          if [ -f .amelioration/resume.md ]; then cp .amelioration/resume.md "$RUNNER_TEMP/sortie/resume.md"; else echo "Pas de résumé." > "$RUNNER_TEMP/sortie/resume.md"; fi
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/sortie/amelioration.patch"
          git diff --cached --stat
          wc -c "$RUNNER_TEMP/sortie/amelioration.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: amelioration
          path: ${{ runner.temp }}/sortie/
          retention-days: 7

  # Build et tests du patch, sans aucun secret ni droit d'écriture. Le résultat est indicatif : le code testé tourne ici et peut écrire ce
  # qu'il veut dans la sortie. La relecture humaine (/code-review) relance les tests.
  tester:
    needs: implementer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: amelioration
          path: ${{ runner.temp }}/sortie

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build et tests
        id: tests
        run: |
          if [ -s "$RUNNER_TEMP/sortie/amelioration.patch" ]; then git apply "$RUNNER_TEMP/sortie/amelioration.patch"; fi
          npm ci
          if npm run build > "$RUNNER_TEMP/tests.log" 2>&1 && npm test >> "$RUNNER_TEMP/tests.log" 2>&1; then echo "tests=ok" >> "$GITHUB_OUTPUT"; else echo "tests=echec" >> "$GITHUB_OUTPUT"; fi
          tail -n 60 "$RUNNER_TEMP/tests.log"

  ouvrir-pr:
    needs: [implementer, tester]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: amelioration
          path: ${{ runner.temp }}/sortie

      - name: Contrôle des fichiers touchés
        id: controle
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/sortie/amelioration.patch"
          if [ ! -s "$patch" ]; then echo "Aucun changement : voir le résumé."; exit 1; fi
          git apply --index "$patch"
          # Tous les chemins, sans renommage (l'ancien et le nouveau nom apparaissent) ni guillemets (accents en clair).
          git -c core.quotePath=false diff --cached --name-only --no-renames > "$RUNNER_TEMP/fichiers.txt"
          cat "$RUNNER_TEMP/fichiers.txt"
          # Interdits : ce qui change ce que font la CI, Netlify, les dépendances ou Claude Code (ajout, modification, suppression ou renommage).
          if grep -E '^(\.github/|\.claude/|\.husky/|scripts/amelioration-agent/|netlify\.toml$|scripts/netlify-ignore\.sh$|package\.json$|package-lock\.json$|\.npmrc$|\.nvmrc$|supabase/config\.toml$|\.amelioration/|CLAUDE(\.local)?\.md$|AGENTS\.md$|\.mcp\.json$)|(^|/)\.gitattributes$|(^|/)\.gitmodules$' "$RUNNER_TEMP/fichiers.txt"; then
            echo "Fichier interdit touché : PR non ouverte."; exit 1
          fi
          # Ni lien symbolique ni sous-module.
          if git diff --cached --raw --no-renames | grep -E ' (120000|160000) '; then
            echo "Lien symbolique ou sous-module : PR non ouverte."; exit 1
          fi
          # À relire de près : base, fonctions, droits, authentification, paiements.
          if grep -Ei '^supabase/|^netlify/functions/|^docs/gestion/.*\.sql$|droits|auth|connexion|invitation|compte|securite|paiement|fiduciaire|sauvegarde|store-supabase' "$RUNNER_TEMP/fichiers.txt" >/dev/null; then
            echo "sensible=1" >> "$GITHUB_OUTPUT"
          else
            echo "sensible=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Branche, PR en brouillon, lien dans l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number }}
          TITRE: ${{ github.event.issue.title }}
          SENSIBLE: ${{ steps.controle.outputs.sensible }}
          # Résultat du job « tester » (une PR ouverte avec le jeton du workflow ne lance pas la CI, règle de GitHub). Ce job n'exécute
          # aucun code du dépôt : il applique le patch, commite et pousse.
          TESTS: ${{ needs.tester.outputs.tests == 'ok' && 'ok' || 'echec' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Ni crochets ni mention dans le titre : « [preview] » lancerait un build Netlify.
          # Le titre est déjà borné par la fonction (« Gestion : » et 80 caractères) : pas de coupe ici, qui couperait un caractère accentué.
          titre=$(printf '%s' "$TITRE" | tr -d '[]{}<>`@')
          branche="amelioration/issue-${NUMERO}-${GITHUB_RUN_NUMBER}"
          # Aucun crochet git actif : le patch ne peut pas en poser (.git n'est pas dans l'arbre suivi) et rien du dépôt n'a tourné ici.
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branche"
          git commit -q -m "$titre (#$NUMERO)" -m "Préparé par l'Action « Amélioration Gestion » depuis la demande #$NUMERO."
          git push -q origin "$branche"
          gh label create amelioration-gestion --color 0b9999 --description "Demande d'amélioration envoyée depuis Gestion" -R "$DEPOT" 2>/dev/null || true
          gh label create a-relire-de-pres --color d93f0b --description "Touche la base, les droits, l'authentification ou les paiements" -R "$DEPOT" 2>/dev/null || true
          gh label create amelioration-pr-prete --color 0e8a16 --description "La PR de cette demande est prête" -R "$DEPOT" 2>/dev/null || true
          {
            [ "$SENSIBLE" = "1" ] && printf '> **À relire de près** : cette PR touche la base, les fonctions, les droits, l'"'"'authentification ou les paiements.\n\n'
            [ "$TESTS" = "ok" ] && printf 'Build et tests : OK dans [le run](%s) (indicatif : à relancer à la relecture).\n\n' "$RUN_URL" || printf '**Build ou tests en échec** : voir [le run](%s).\n\n' "$RUN_URL"
            printf 'Closes #%s\n\n## Résumé de Claude\n\n' "$NUMERO"
            # Dans un bloc de code : ni mention, ni « Closes #… », ni image du résumé n'agissent.
            printf '~~~~text\n'
            grep -v '^~~~~' "$RUNNER_TEMP/sortie/resume.md" || true
            printf '\n~~~~\n'
            printf '\n\n## Avant de fusionner\n\n- Relire le diff, lancer `/code-review` (et `/security-review` si la PR est à relire de près).\n- La CI ne part pas seule sur une PR ouverte par l'"'"'Action : fermer puis rouvrir la PR la lance.\n- Aucune migration n'\''est appliquée et rien n'\''est déployé.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n'
          } > "$RUNNER_TEMP/corps.md"
          labels="amelioration-gestion"
          [ "$SENSIBLE" = "1" ] && labels="$labels,a-relire-de-pres"
          url=$(gh pr create -R "$DEPOT" --draft --base master --head "$branche" --title "$titre" --body-file "$RUNNER_TEMP/corps.md" --label "$labels")
          echo "PR : $url"
          gh issue comment "$NUMERO" -R "$DEPOT" --body "PR prête à relire : $url<!-- gestion-pr url=$url sensible=$SENSIBLE tests=$TESTS -->"
          gh issue edit "$NUMERO" -R "$DEPOT" --add-label amelioration-pr-prete

  echec:
    needs: [verifier, implementer, tester, ouvrir-pr]
    if: failure() && needs.verifier.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Repère d'échec dans l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create amelioration-echec --color b60205 --description "L'Action n'a pas pu préparer la PR" -R "$DEPOT" 2>/dev/null || true
          gh issue comment "$NUMERO" -R "$DEPOT" --body "L'Action n'a pas pu préparer la PR : voir $RUN_URL. Pour relancer, retirer puis remettre le label amelioration-gestion.<!-- gestion-echec -->"
          gh issue edit "$NUMERO" -R "$DEPOT" --add-label amelioration-echec

  fermer:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      startsWith(github.event.pull_request.head.ref, 'amelioration/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: La demande passe à « non retenue »
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          numero=$(printf '%s' "$REF" | sed -E 's#^amelioration/issue-([0-9]+)-[0-9]+$#\1#')
          case "$numero" in ''|*[!0-9]*) echo "Branche inattendue"; exit 1 ;; esac
          gh issue close "$numero" -R "$DEPOT" --reason "not planned" --comment "PR fermée sans fusion : la demande n'est pas retenue."
